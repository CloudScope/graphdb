[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paysentry"
version = "0.1.0"
description = "Real-time payments fraud/AML detection on TigerGraph + Raphtory (graphdb course capstone)"
requires-python = ">=3.13"
dependencies = [
    "raphtory==0.17.0",
    "pyTigerGraph==2.0.4",
    "pyarrow==25.0.1",
    "numpy==2.5.2",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.3",
]

[project.scripts]
paysentry = "paysentry.cli:main"

[tool.setuptools.packages.find]
include = ["paysentry*"]

[tool.setuptools.package-data]
paysentry = ["store/gsql/*.gsql", "store/gsql/queries/*.gsql"]
